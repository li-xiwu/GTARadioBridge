name: Build GTARadioBridge

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore GTARadioBridge.csproj

      - name: Build
        run: dotnet build GTARadioBridge.csproj -c Release --no-restore

      - name: Publish (standalone exe)
        run: dotnet publish GTARadioBridge.csproj -c Release -r win-x64 --self-contained true -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTARadioBridge-win-x64
          path: ./publish/
